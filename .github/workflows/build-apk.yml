name: Build APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Generate app icon (Pillow)
        run: |
          pip install pillow
          python3 tools/make_icon.py .
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bentleyplayz-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/bentleyplayz-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - APK will use the default debug signature"
          fi
      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | head -n 5; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ModBuilder-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
